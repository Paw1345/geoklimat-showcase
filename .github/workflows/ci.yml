name: GeoKlimat checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker compose build web
      - name: Lint and formatting
        run: |
          docker compose run --rm --no-deps web ruff check .
          docker compose run --rm --no-deps web ruff format --check .
      - name: Django checks, migrations and tests
        run: |
          docker compose up -d --wait db
          docker compose run --rm web python manage.py check
          docker compose run --rm web python manage.py makemigrations --check --dry-run
          docker compose run --rm web python manage.py migrate --noinput
          docker compose run --rm web python manage.py test --noinput
      - name: Build production image
        run: docker build --target production -t geoklimat:ci .
      - name: Production configuration check
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-secret-with-more-than-fifty-characters-12345
          POSTGRES_PASSWORD: ci-only-database-password
        run: |
          docker run --rm -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e DJANGO_SECRET_KEY -e POSTGRES_PASSWORD \
            -e DJANGO_ALLOWED_HOSTS=monitor.example.org geoklimat:ci \
            python manage.py check --deploy --fail-level WARNING
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop CI containers
        if: always()
        run: docker compose down
