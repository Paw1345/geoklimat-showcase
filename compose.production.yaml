name: geoklimat-production
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/live/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}); urllib.request.urlopen(r, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: .
      target: production
    env_file: .env.production
    command: python manage.py ingestion_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
