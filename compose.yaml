name: geoklimat
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoklimat}
      POSTGRES_USER: ${POSTGRES_USER:-geoklimat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build:
      context: .
      target: development
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-not-for-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_DB: ${POSTGRES_DB:-geoklimat}
      POSTGRES_USER: ${POSTGRES_USER:-geoklimat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
  worker:
    build:
      context: .
      target: development
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      POSTGRES_DB: ${POSTGRES_DB:-geoklimat}
      POSTGRES_USER: ${POSTGRES_USER:-geoklimat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_HOST: db
    command: python manage.py ingestion_worker
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
